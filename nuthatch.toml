[nest]
name = "horizon"
chain = "arbitrum-one"
chain_id = 42161
# RPC endpoints, measured 2026-08-06 against this nest's actual workload.
#
# TWO SEPARATE HAZARDS, and they need different handling.
#
# 1. Silent capping. `arb1.arbitrum.io` answers `[]` instead of erroring when a range is too wide:
#    a 5M-block `AllocationCreated` query returns ZERO there and 10,783 on a real endpoint. A
#    backfill trusting that produces a nest which reports itself synced and holds nothing. It is
#    FINE at the 100k windows seal-direct actually uses, which is why it stays here — but never
#    widen a range against it and believe an empty answer.
#
# 2. Endpoints that always fail burn the retry budget. `arb-pokt.nodies.app` (403),
#    `arbitrum-one-rpc.publicnode.com` (403) and `arbitrum.drpc.org` (400) refused every single
#    request for this contract. With five attempts per window and three guaranteed failures in
#    rotation, a window that a good endpoint would serve on retry instead exhausts its attempts and
#    kills the backfill. They are removed rather than demoted: a fallback that cannot succeed is not
#    a fallback.
#
# For a from-deployment backfill, override with an endpoint you control:
#
#     nuthatch dev --dir horizon-nest --rpc https://your-archive-endpoint --concurrency 1
#
# `--rpc` is tried ahead of everything below. Do not commit a personal endpoint here; this repo is
# public and an unauthenticated RPC URL in it is an invitation. Note that a private endpoint may
# still rate-limit: ours answers HTTP 403 (not 429) above concurrency 1-2, which reads like an auth
# failure and is not.
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
]
schema_version = 1

[[contracts]]
alias = "staking"
address = "0x00669a4cf01450b64e8a2a20e9b1fcb71e61ef03"
start_block = 42449585
abi = "abis/staking.json"

[[contracts]]
alias = "service"
address = "0xb2bb92d0de618878e438b55d5846cfecd9301105"
start_block = 397492865
abi = "abis/service.json"

[[contracts]]
# GraphTallyCollector — TAP settlement. `RAVCollected` and `PaymentCollected` give realised query
# fees per (payer, data service, receiver) straight from the chain, with nobody self-reporting.
# This is the half of QoS that active probing cannot produce: a probe knows what a query cost us,
# never what the network actually paid an indexer.
#
# Same contract the Lodestar Oracle's own TAP receipts are signed against, so the fees it indexes
# include ours.
#
# start_block bisected to the contract's first log (first activity falls in 399485933..399589294);
# rounded down to a safe boundary rather than guessed.
alias = "tally"
address = "0x8f69f5c07477ac46fbc491b1e6d91e2bb0111a9e"
start_block = 399485933
abi = "abis/tally.json"

[[contracts]]
alias = "extension"
address = "0x3be385576d7c282070ad91bf94366de9f9ba3571"
start_block = 180370540
abi = "abis/extension.json"
